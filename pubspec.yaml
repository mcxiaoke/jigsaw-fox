name: jigsawpuzzle
description: "A Jigsaw Puzzle Game."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.3+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.2.0
  crypto: ^3.0.6
  dio: ^5.11.0
  file_picker: ^8.1.7
  flame: ^1.38.0
  flame_audio: ^2.12.2
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  hive_ce: ^2.19.3
  image: ^4.9.2
  image_picker: ^1.2.3
  intl: ^0.20.2
  logging: ^1.3.0
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  phosphoricons_flutter: ^1.0.0
  shared_preferences: ^2.5.5
  slang: ^4.19.1
  slang_flutter: ^4.19.0
  vector_math: ^2.2.0
  flutter_native_splash: ^2.4.8
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0
  device_info_plus: ^12.4.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  slang_build_runner: ^4.19.0
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/bg/
    - assets/audio/
