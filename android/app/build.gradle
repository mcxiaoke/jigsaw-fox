plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.mcxiaoke.jigsawpuzzle"
    compileSdkVersion 36

    ndkVersion flutter.ndkVersion

    // 统一 Java/Kotlin JVM target，避免 Inconsistent JVM Target 错误
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.mcxiaoke.jigsawpuzzle"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
            // enable for signing apk build
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix ".dev"
        }
        release {
            signingConfig signingConfigs.release
        }

        profile {
            signingConfig signingConfigs.release
        }
    }

    // Flutter 插件在 --split-per-abi 构建时会把各 ABI 包 versionCode 改写为 abiIndex*1000+baseVersionCode
    // （为 Play Store 多包同时上传设计，见 flutter_tools 的 FlutterPlugin.kt）。
    // 本项目使用自有 updates.json 分发，采用单一 versionCode 模型（设计文档
    // docs/app-auto-update-design-20260914.md），且客户端版本比对依赖安装包真实 versionCode
    // 与清单基础值一致（lib/update/update_service.dart），因此强制所有 ABI 包 versionCode
    // 与 pubspec 基础值保持一致。
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.versionCodeOverride = flutterVersionCode.toInteger()
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
